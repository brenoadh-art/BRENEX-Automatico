<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRENEX • Ofertas Automáticas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:58px;height:58px;border-radius:50%;object-fit:cover}.brand{font-weight:800;letter-spacing:2px;font-size:23px}.muted{color:#aaa}
.grid{display:grid;grid-template-columns:370px 1fr;gap:18px}.card{background:#15151a;border:1px solid #2a2a31;border-radius:18px;padding:18px}
input{width:100%;padding:13px;border:1px solid #383840;background:#0e0e12;color:#fff;border-radius:10px;margin-top:6px}button{border:0;border-radius:10px;padding:13px 15px;font-weight:700;cursor:pointer}.gold{background:#d9b55b;color:#111}.dark{background:#292930;color:#fff}.full{width:100%;margin-top:10px}.status{padding:10px;border-radius:10px;background:#0e0e12;margin-top:12px;font-size:13px;color:#bbb}.ok{color:#d9b55b}.preview{text-align:center}.preview canvas{width:min(100%,540px);border-radius:12px}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.small{font-size:12px;line-height:1.5;color:#999}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header><img class="logo" src="brenex_logo.png"><div><div class="brand">BRENEX</div><div class="muted">Gerador automático de ofertas</div></div></header>
<div class="grid">
<section class="card">
<button id="connect" class="gold full">CONECTAR MERCADO LIVRE</button>
<div id="conn" class="status">Verificando conexão...</div>
<hr style="border:0;border-top:1px solid #292930;margin:18px 0">
<label class="muted">Cole o link do produto</label>
<input id="url" placeholder="https://meli.la/...">
<button id="import" class="gold full">IMPORTAR AUTOMATICAMENTE</button>
<div id="status" class="status">Depois de conectado, basta colar o link.</div>
<label class="muted" style="display:block;margin-top:14px">Produto</label>
<input id="name">
<label class="muted" style="display:block;margin-top:10px">Preço</label>
<input id="price">
<div class="row"><button id="refresh" class="dark">Atualizar arte</button><button id="download" class="dark">Baixar PNG</button></div>
<div class="small" style="margin-top:14px">O acesso é feito por OAuth do Mercado Livre. O segredo da aplicação fica no servidor, não no navegador.</div>
</section>
<section class="card">
<h3 style="margin-top:0">Prévia da oferta</h3>
<div class="preview"><canvas id="c" width="1080" height="1350"></canvas></div>
</section>
</div></div>
<script>
const $=id=>document.getElementById(id); let product=null, logo=new Image(); logo.src='brenex_logo.png'; logo.onload=draw;
function price(v,c='BRL'){let n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:c}).format(n):v}
async function status(){let r=await fetch('/api/status');let x=await r.json();$('conn').innerHTML=x.connected?'<span class="ok">✓ Mercado Livre conectado</span>':'Mercado Livre não conectado';}
$('connect').onclick=()=>location.href='/auth/mercadolivre';
$('import').onclick=async()=>{let url=$('url').value.trim();if(!url)return;
$('status').textContent='Buscando nome, preço e imagens...';
try{let r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});let x=await r.json();if(!r.ok)throw Error(x.error);
product=x;$('name').value=x.title||'';$('price').value=price(x.price,x.currency||'BRL');$('status').innerHTML='<span class="ok">✓ Importado automaticamente.</span>';draw();
}catch(e){$('status').textContent=e.message}};
$('refresh').onclick=draw;
$('download').onclick=()=>{let a=document.createElement('a');a.download='brenex-oferta.png';a.href=$('c').toDataURL('image/png');a.click()};
['name','price'].forEach(id=>$(id).addEventListener('input',draw));
function fit(ctx,img,x,y,w,h){if(!img||!img.width)return;let s=Math.min(w/img.width,h/img.height),nw=img.width*s,nh=img.height*s;ctx.drawImage(img,x+(w-nw)/2,y+(h-nh)/2,nw,nh)}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
const c=$('c'),ctx=c.getContext('2d');ctx.clearRect(0,0,1080,1350);
let g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#09090b');g.addColorStop(.55,'#1b160d');g.addColorStop(1,'#050506');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);
ctx.strokeStyle='#d9b55b';ctx.lineWidth=4;rr(ctx,25,25,1030,1300,30);ctx.stroke();fit(ctx,logo,65,55,180,180);
ctx.fillStyle='#fff';ctx.font='bold 54px Arial';ctx.textAlign='right';ctx.fillText('OFERTA',1010,120);
ctx.fillStyle='#fff';rr(ctx,75,230,930,650,28);ctx.fill();
if(product?.image){let im=new Image();im.crossOrigin='anonymous';im.onload=()=>{fit(ctx,im,105,260,870,590);finish()};im.src=product.image}else finish();
function finish(){ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 48px Arial';let n=$('name').value.toUpperCase()||'SEU PRODUTO';let a=n.split(' '),line='',lines=[];for(let w of a){if((line+' '+w).trim().length>25){lines.push(line);line=w}else line=(line+' '+w).trim()}lines.push(line);lines.slice(0,2).forEach((l,i)=>ctx.fillText(l,75,975+i*58));ctx.fillStyle='#d9b55b';ctx.font='bold 70px Arial';ctx.fillText($('price').value||'R$ 0,00',75,1125);ctx.fillStyle='#fff';rr(ctx,75,1170,365,82,41);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 27px Arial';ctx.fillText('🛒 COMPRE AQUI',135,1222);ctx.fillStyle='#8d8d94';ctx.font='20px Arial';ctx.fillText('BRENEX • ofertas e oportunidades',75,1290)}
}
status(); if(new URLSearchParams(location.search).get('connected')){$('status').innerHTML='<span class="ok">✓ Conta conectada. Agora cole um link.</span>'}
if(new URLSearchParams(location.search).get('error'))$('status').textContent=new URLSearchParams(location.search).get('error');
</script>
</body></html>
